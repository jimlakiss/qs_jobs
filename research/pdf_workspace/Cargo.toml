[package]
name = "iqs-pdf-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=25.0.2", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=25.0.2", default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=25.0.2", default-features = false, features = ["vulkan", "wgsl"] }

[profile.dev]
debug = 0

[profile.release]
debug = 0
